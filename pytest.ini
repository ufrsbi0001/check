; pytest.ini — Pytest configuration for the trading bot.
;
; REV 1.0 (2026-10-04):
;   - testpaths= tests  → `pytest` alone runs the tests/ folder
;   - filterwarnings   → suppress python-binance + websockets
;     DeprecationWarnings that are library-internal (not our code)
;   - addopts          → verbose by default, short traceback
;
; (moved to repo root in PATCH P3 so `python -m pytest` actually picks it up)
;
; Run:
;     python -m pytest                  (uses this file automatically)
;     python -m pytest -q               (quiet summary)
;     python -m pytest tests/ -k cid    (only tests matching "cid")

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

; Verbose by default. Change to `-q` if you prefer the quiet summary.
; --tb=short keeps failure output readable without losing context.
addopts = -v --tb=short

; Suppress library-internal DeprecationWarnings that have no bearing
; on the bot's behavior. Trading logic is REST-only; the WS warnings
; come from python-binance's optional websocket client, which we do
; not exercise.
filterwarnings =
    ignore::DeprecationWarning:binance.*
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:websockets.legacy.*
    ignore::DeprecationWarning:binance.ws.*
    ; Also silence the generic "websockets.legacy is deprecated" text
    ; emitted from the module itself (matched by message):
    ignore:websockets\.legacy is deprecated:DeprecationWarning
    ignore:websockets\.WebSocketClientProtocol is deprecated:DeprecationWarning

; Fail the run if any test emits a warning we didn't explicitly ignore.
; This keeps future warnings visible instead of drowning in old ones.
; (Comment out if it gets too noisy during library upgrades.)
; filterwarnings + error would go here, but we keep it soft for now.

; Show local variables in tracebacks — helpful for debugging failures.
; Set to `no` if you prefer minimal output.
console_output_style = progress